[workspace]
resolver = "2"
members = ["."]

[package]
name = "mrecord-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "with-chrono", "with-rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
# `serde-float`：让 `Decimal` 的**默认**序列化输出 JSON 数字，对齐 Java Jackson 与前端 `number` 类型。
# 即使漏写 `#[serde(serialize_with = ...)]`，默认也是数字而不是字符串（见 `common::money` 单元测试）。
# 刻意不启用 `serde-with-str`：`rust_decimal::serde::str` 模块随之不可用，
# 原先导致前端金额变字符串的写法从此无法再编译通过。
rust_decimal = { version = "1", features = ["serde-float"] }
# 用户模块所需依赖
# bcrypt: 密码哈希（对应 Java BCrypt）
bcrypt = "0.19"
# jsonwebtoken: JWT 生成与解析（对应 Java io.jsonwebtoken）
# v11 起必须显式选择 crypto backend（`rust_crypto`），否则运行时 panic
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# uuid: 生成用户主键（对应 Java IdUtil.simpleUUID）
uuid = { version = "1", features = ["v4"] }
# regex: 邮箱格式校验（替代 Java Validator.isEmail）
regex = "1"
# once_cell: 进程级常量缓存（用于编译一次的 Regex）
once_cell = "1"
# 邮件模块所需依赖
# lettre: SMTP 客户端（对应 Java apache-commons-email 的 HtmlEmail）
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
# 导出任务模块所需依赖
# rust_xlsxwriter: 生成 Excel 文件（对应 Java EasyExcel / POI 导出能力）
rust_xlsxwriter = "0.99"
# 静态资源模块所需依赖
# tower-http: 托管前端构建产物（对应 Java static resources）
tower-http = { version = "0.7", features = ["fs"] }
# tower: `static_files::StaticService` 需实现 `Service` trait 才能接入
# `Router::fallback_service`；覆盖模式（`MRECORD_STATIC_DIR`）下亦需驱动内建 `ServeDir`
tower = { version = "0.5", features = ["util"] }
# include_dir: 编译期把整个 static/ 目录内嵌进二进制，消除运行时 cwd / 数据卷依赖
include_dir = "0.7.4"

[dev-dependencies]
# calamine: 单元测试中读回 rust_xlsxwriter 生成的 Excel，校验多 Sheet 布局与单元格内容
calamine = "0.36"
